name: Distribute Android build

# Builds a release APK (signed with the shared debug keystore so it updates in place) and sends it
# to Firebase App Distribution. Testers get a notification and install with one tap — no Play Store.
#
# Run by hand, from the Actions tab or `gh workflow run android-distribute.yml --ref main`. It used
# to run on every merge touching apps/mobile, which was about 20 of the account's Actions minutes a
# time and the second largest spender; testers need a build when there is something to try, not on
# every merge. Nothing here tests the app: mobile.yml does that on every pull request.
on:
  workflow_dispatch:

concurrency:
  group: android-distribute
  cancel-in-progress: true

jobs:
  distribute:
    name: distribute
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Without this the build downloads and recompiles everything: about 20 minutes a run.
          cache: gradle
      - run: npm ci
      # env.ts is gitignored; CI writes the cloud target so the distributed app talks to the hosted project.
      # env.ts is gitignored; CI writes the cloud target. These are public client values, not secrets.
      - name: Write cloud config
        run: |
          cat > src/config/env.ts <<'EOF'
          export const env = {
            supabaseUrl: 'https://rezavwgigxkkjycpfvkd.supabase.co',
            supabaseAnonKey: 'sb_publishable_4JWjKB1D-0ZGHWGzLcGZdQ_-uVAsERj',
          };
          EOF
      # Push (#36): the Firebase config is gitignored; the build needs it.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build release APK (arm64)
        run: ./android/gradlew -p android assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: devs
          file: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message || format('Manual build of {0}', github.sha) }}
