name: Database tests

on:
  # Pull requests only: see mobile.yml. No paths filter, because db-tests is a required check and a
  # check that is skipped never reports, which would block the merge.
  pull_request:

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Applies every migration from scratch on a fresh database.
      - run: supabase db start
      - name: Run database tests
        shell: bash
        run: supabase test db 2>&1 | tee "$RUNNER_TEMP/db-tests.log"
      # Shows each test file and any failed tests on the run's summary page.
      - name: Write test summary
        if: always()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/db-tests.log" ] || exit 0
          .github/scripts/db-test-summary.sh "$RUNNER_TEMP/db-tests.log" >> "$GITHUB_STEP_SUMMARY"
