name: Database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Applies every migration from scratch on a fresh database.
      - run: supabase db start
      - run: supabase test db
