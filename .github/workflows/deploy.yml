name: Deploy to Supabase

# Applies migrations and deploys Edge Functions to the hosted project whenever
# backend changes land on main. PRs are already gated by db-tests and function-tests
# (branch protection), so anything here has passed its tests before merge.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'
  # Lets a deploy be run by hand: after a failed run, or to put the hosted project back in step
  # with main (every function is deployed, since there is no push to compare against).
  workflow_dispatch:

# Never let two deploys run at once; let an in-flight one finish.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      # Full history: the function check below diffs against the commit before this push,
      # which a shallow clone doesn't have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      # Applies only migrations the project hasn't seen yet.
      - name: Push migrations
        run: supabase db push

      # Only redeploys functions when a function file changed in this push. If the diff can't be
      # worked out (a force push, a first push, a commit that has gone), deploy anyway: deploying
      # functions that haven't changed costs a minute, while skipping one that has leaves the
      # database calling a function that isn't there. This check failed closed until 2026-10-26
      # and no function was ever deployed by CI.
      - name: Check for function changes
        id: fns
        run: |
          before='${{ github.event.before }}'
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "cannot see $before; deploying functions to be safe"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" '${{ github.sha }}' | grep -q '^supabase/functions/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Edge Functions
        if: steps.fns.outputs.changed == 'true'
        run: |
          supabase functions deploy media --project-ref "$PROJECT_REF"
          supabase functions deploy push --project-ref "$PROJECT_REF"
          supabase functions deploy account-purge --project-ref "$PROJECT_REF"
          supabase functions deploy purge-chat-media --project-ref "$PROJECT_REF"
          supabase functions deploy copy-evidence --project-ref "$PROJECT_REF"
          supabase functions deploy places --project-ref "$PROJECT_REF"
