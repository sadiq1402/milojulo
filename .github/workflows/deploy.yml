name: Deploy to Supabase

# Applies migrations and deploys Edge Functions to the hosted project whenever
# backend changes land on main. PRs are already gated by db-tests and function-tests
# (branch protection), so anything here has passed its tests before merge.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'

# Never let two deploys run at once; let an in-flight one finish.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      # Applies only migrations the project hasn't seen yet.
      - name: Push migrations
        run: supabase db push

      # Only redeploys functions when a function file changed in this push.
      - name: Check for function changes
        id: fns
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
             | grep -q '^supabase/functions/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Edge Functions
        if: steps.fns.outputs.changed == 'true'
        run: |
          supabase functions deploy media --project-ref "$PROJECT_REF"
          supabase functions deploy push --project-ref "$PROJECT_REF"
          supabase functions deploy account-purge --project-ref "$PROJECT_REF"
