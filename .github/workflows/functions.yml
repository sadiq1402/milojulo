name: Edge Functions

on:
  pull_request:
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/functions.yml']

jobs:
  function-tests:
    name: function-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        function: [_shared, media, push, account-purge]
    defaults:
      run:
        working-directory: supabase/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check *.ts
      - run: deno test
