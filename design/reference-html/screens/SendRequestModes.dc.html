<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.scr{--ground:#FFF7FB;--ink:#2B1233;--sub:#6D5876;--line:#F3DDEA;--pine:#CC2E86;--pine-soft:#FFE3F1;--sun:#FFE27A;--sun-soft:#FFF1B8;--brick:#C62828;--brick-soft:#FFE3DC;
box-sizing:border-box;display:flex;flex-direction:column;background:var(--ground);padding-top:48px;overflow:hidden;position:relative;font-family:'Figtree',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:24px}
.scr *{box-sizing:border-box}
.disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-0.015em}
.top,.main,.prog{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;min-height:56px}
.iconbtn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink);border-radius:24px;text-decoration:none;padding:0}
.ttl{font-weight:600;font-size:17px;line-height:24px}
.main{flex:1;min-height:0;overflow:hidden;padding:0 20px;display:flex;flex-direction:column;gap:16px}
.h1{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-weight:700;font-size:28px;line-height:32px;margin:0;letter-spacing:-0.02em}
.h2{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-weight:700;font-size:20px;line-height:24px;margin:0;letter-spacing:-0.01em}
.sub{color:var(--sub);font-size:14px;line-height:20px;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:26px;font-weight:700;font-size:16px;line-height:20px;text-decoration:none;border:1px solid transparent;padding:0 20px;width:100%;font-family:inherit}
.btn.pri{background:var(--pine);color:#fff;box-shadow:0 10px 22px rgba(204,46,134,.28)}
.btn.sec{background:#fff;color:var(--ink);border-color:#E9CFE0}
.btn.danger{background:var(--brick);color:#fff;box-shadow:0 10px 22px rgba(198,40,40,.25)}
.btn.txt{background:none;color:var(--pine);min-height:48px}
.btn.sm{min-height:44px;font-size:15px;width:auto;flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:14px}
.inp{height:52px;border:1px solid #E9CFE0;border-radius:26px;background:#fff;padding:0 20px;font:inherit;font-size:16px;color:var(--ink);width:100%}
.ta{min-height:96px;border:1px solid #E9CFE0;border-radius:20px;background:#fff;padding:12px 16px;font:inherit;font-size:16px;color:var(--ink);width:100%;resize:none}
.card{background:#fff;border:0;border-radius:24px;box-shadow:0 8px 24px rgba(142,31,96,.08)}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid #E9CFE0;background:#fff;font-size:14px;line-height:20px;font-weight:500;color:var(--ink);text-decoration:none;gap:6px;font-family:inherit}
.chip.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;background:#FBEAF3;font-size:12px;line-height:16px;font-weight:500;color:#4A2F55;white-space:nowrap}
.tag.match{background:var(--pine-soft);color:#8E1F60}
.tag.sun{background:var(--sun-soft);color:#2B1233}
.tag.fr{background:#CFF1E5;color:#0B4A3E}
.tag.ac{background:#FFF1B8;color:#2B1233}
.tag.nw{background:#D6ECFF;color:#1F4E79}
.tag.dt{background:#FFE3F1;color:#8E1F60}
.tag.cs{background:#E3D4FF;color:#4B2BB8}
.tag.warn{background:var(--brick-soft);color:#8B1D1D}
.ph{display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-weight:700;color:rgba(43,18,51,.42);flex:none}
.tabs{display:flex;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(142,31,96,.10);padding:4px 8px 34px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font-size:12px;line-height:16px;font-weight:500;color:var(--sub);text-decoration:none}
.tab.on{color:var(--pine);font-weight:700}
.pillic{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tab.on .pillic{background:var(--pine-soft)}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.col{display:flex;flex-direction:column}
.sheet{background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 34px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(43,18,51,.14);position:absolute;left:0;right:0;bottom:0}
.scrim{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(43,18,51,.5)}
.grab{width:40px;height:5px;border-radius:3px;background:#EBD3E2;align-self:center}
.prog{display:flex;gap:6px;padding:0 20px 8px}
.prog i{flex:1;height:4px;border-radius:2px;background:#F6DFEC;display:block}
.prog i.on{background:var(--pine)}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:64px;border-radius:20px;border:1px solid #E9CFE0;background:#fff}
.opt.on{border-color:var(--pine);background:#FFF1F8;box-shadow:inset 0 0 0 1px var(--pine)}
.opt input{width:24px;height:24px;accent-color:#CC2E86;flex:none;margin:0}
.opt .t{font-weight:600}
.cb{display:flex;align-items:flex-start;gap:12px;min-height:48px;font-size:14px;line-height:20px}
.cb input{width:24px;height:24px;accent-color:#CC2E86;flex:none;margin:1px 0 0}
.sw{position:relative;display:inline-block;width:52px;height:32px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
.sw span{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:16px;background:#E9CFE0}
.sw span::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#fff}
.sw input:checked + span{background:var(--pine)}
.sw input:checked + span::after{left:24px}
.list{display:flex;flex-direction:column;background:#fff;border:0;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(142,31,96,.08)}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.seg{display:flex;background:#FBEAF3;border-radius:26px;padding:4px;gap:4px}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:22px;font-weight:600;font-size:15px;color:var(--sub);text-decoration:none}
.seg a.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(43,18,51,.12)}
.dot{width:10px;height:10px;border-radius:5px;background:var(--pine);flex:none}
.bub{max-width:78%;padding:10px 14px;border-radius:22px;font-size:16px;line-height:22px}
.bub.in{background:#fff;box-shadow:0 4px 12px rgba(142,31,96,.10);align-self:flex-start;border-bottom-left-radius:6px}
.bub.out{background:var(--pine);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
a{color:#CC2E86}
</style>
